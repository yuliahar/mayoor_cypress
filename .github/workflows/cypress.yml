name: Mayoor cypress tests

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
#     strategy:
#       fail-fast: false
#       matrix:
#         containers: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm i

      - name: Prisma generate
        run: npm run generate:prisma

      - name: Run Cypress e2e tests
        uses: cypress-io/github-action@v5
        with:
          # we have already installed all dependencies above
          install: false
          command: npx cypress run --env configFile=qa
          browser: chrome
          continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Upload Cypress Screenshots
        uses: actions/upload-artifact@v1
        # Only capture images on failure
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload Cypress Logs
        uses: actions/upload-artifact@v1
        # Only capture logs on failure
        if: failure()
        with:
          name: cypress-logs
          path: cypress/logs

      - name: Upload Cypress Videos
        uses: actions/upload-artifact@v1
        # Only capture videos on failure
        if: failure()
        with:
          name: cypress-videos
          path: cypress/videos

      - name: Copy test execution videos
        run: |
            mkdir public
            cp -r cypress/videos public/videos

      - name: Copy test execution screenshots
        run: cp -r cypress/screenshots public/screenshots

      - name: Copy test execution logs
        run: cp -r cypress/logs public/logs

      - name: Merge test results into one
        run: npm run combine-reports

      - name: Generate HTML report
        run: npm run generate-report

      - name: Deploy report page
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
