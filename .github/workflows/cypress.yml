name: Mayoor cypress tests

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
#     strategy:
#       fail-fast: false
#       matrix:
#         containers: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm i
      - name: Prisma generate
        run: npm run generate:prisma
      - name: 'UI Tests - Chrome'
        uses: cypress-io/github-action@v5.x.x # use the explicit version number
        with:
          # we have already installed all dependencies above
          install: false
          start: npm run cy:run:qa
          wait-on: 'https://mayoor-qa.vercel.app'
          wait-on-timeout: 120
          browser: chrome
          group: 'UI - Chrome'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
