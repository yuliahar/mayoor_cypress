name: Mayoor cypress tests

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
#     strategy:
#       fail-fast: false
#       matrix:
#         containers: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cypress run
        uses: cypress-io/github-action@v5
        with:
          start: npm run cy:run:qa
